spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mentormatch
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update #to run the seeder again change this to 'create' and after the first run switch it back to update
    show-sql: true
    open-in-view: false
